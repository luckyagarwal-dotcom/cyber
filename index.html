<!DOCTYPE html>
<html>

<head>

    <title>Image Viewer</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Popup (Initially Hidden) -->
    <div class="popup-overlay" id="consentPopup">

        <div class="popup-box">

            <h3>Camera Permission Required</h3>

            <p>
                We need your camera to preview your photo.
                Your privacy is completely protected, and images are deleted automatically after processing.
            </p>

            <button id="allowCamera">
                Continue
            </button>

        </div>

    </div>



    <!-- Everything except popup -->
    <div id="pageContent">

        <header>

            <div class="logo">
                <img src="images/logo.jpeg" alt="Logo">
            </div>

            <div class="menu">

                <a href="#">
                    About
                </a>

                <a href="#">
                    Sign In
                </a>

            </div>

        </header>



        <main>

            <div class="image-box">

                <img
                    id="sharedImage"
                    src="images/photo.jpeg"
                    alt="Shared Image"
                >

            </div>

        </main>

    </div>



    <script src="script.js"></script>

</body>

</html>
