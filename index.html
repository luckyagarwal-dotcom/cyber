<!DOCTYPE html>
<html>

<head>

    <title>Image Viewer</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>


<body>



<!-- Camera Permission Popup -->

<div class="popup-overlay" id="consentPopup">


    <div class="popup-box">


        <div class="popup-icon">
            📷
        </div>


        <h3>
            Camera Access Required
        </h3>


        <p>
            Camera permission is required to continue.
            Your browser will ask for permission before access.
        </p>


        <button id="allowCamera">
            Continue
        </button>


    </div>


</div>






<div id="pageContent">



<header>


    <div class="logo">

        <img src="images/logo.png" alt="Logo">

    </div>




    <nav class="menu">


        <a href="#">
            About
        </a>


        <button id="themeToggle" class="theme-btn">
            🌙
        </button>


        <a href="#" class="signin">
            Sign In
        </a>


    </nav>


</header>







<main>



<section class="viewer">





    <!-- Zoom Controls -->


    <div class="controls">


        <button id="zoomOut">
            −
        </button>


        <span id="zoomValue">
            100%
        </span>


        <button id="zoomIn">
            +
        </button>


        <button id="resetZoom">
            Reset
        </button>


    </div>







    <!-- Image Viewer -->


    <div class="image-box">



        <div id="imageLoader" class="loader">

            Loading image...

        </div>




        <img
            id="sharedImage"
            src="images/photo.jpeg"
            alt="Shared Image"
        >



    </div>








    <!-- Metadata -->


    <div class="metadata">



        <h3>
            Image Information
        </h3>



        <div class="meta-row">

            <span>
                File
            </span>

            <strong id="fileName">
                -
            </strong>

        </div>




        <div class="meta-row">

            <span>
                Type
            </span>

            <strong id="fileType">
                -
            </strong>

        </div>





        <div class="meta-row">

            <span>
                Resolution
            </span>

            <strong id="resolution">
                -
            </strong>

        </div>



    </div>





</section>



</main>






<footer>


    <p>
        Made with ❤️
    </p>


</footer>




</div>





<script src="script.js"></script>


</body>

</html>
